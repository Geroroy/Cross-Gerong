for(let row=0;row<3;row++)for(let col=0;col<3;col++){if(row===0&&col===1)continue;const x=(col-1)*4,z=row*3.5;add(1.8,.15,1.1,0xac7448,x,1.2,z);add(.12,1.2,.12,0x515964,x-.7,.6,z);add(.12,1.2,.12,0x515964,x+.7,.6,z);add(1,.15,.9,0x617d87,x,.58,z+1);add(1,1,.12,0x617d87,x,1,z+1.4);add(.55,.06,.45,0xfff7dc,x,1.31,z);if(row===1&&col===1)continue;const n=CHARACTERS[(row+col)%CHARACTERS.length].build();n.scale.setScalar(.75);n.position.set(x,1.3,z+.85);classScene.add(n);}

}
function disposeClassScene(){if(classScene)classScene.traverse(o=>{if(o.userData.ownedMaterial)o.material.dispose();if(o.userData.owned){o.material.map.dispose();o.material.dispose();o.geometry.dispose();}});classScene=null;classActor=null;classFocus=null;$('cutsceneUI').hidden=true;}

function renderClassScene(dt){classClock+=dt;const t=Math.min(1,classClock/10),ease=t*t*(3-2*t);classCamera.aspect=innerWidth/innerHeight;classCamera.updateProjectionMatrix();const vfov=THREE.MathUtils.degToRad(classCamera.fov),hfov=2*Math.atan(Math.tan(vfov/2)*classCamera.aspect),distance=classSpan/(2*Math.tan(Math.min(vfov,hfov)/2))*(1.9-.35*ease);classCamera.position.copy(classFocus).addScaledVector(new THREE.Vector3(.35,.12,-1).normalize(),distance);classCamera.lookAt(classFocus);classActor.rotation.z=Math.sin(classClock*2)*.025;$('sceneCaption').textContent=classClock<3?'진흥관 영어영문학과 수업에 도착했어요':classClock<7?'교수님: Today, let’s talk about journeys in English literature.':className+': 이제 새로운 이야기가 시작됩니다.';renderer.render(classScene,classCamera);if(classClock>=12)endClassScene();}
