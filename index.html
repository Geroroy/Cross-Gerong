<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>크로스 게롱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  /* Layout: full-screen 3D canvas of a Gyeongju street; HUD pinned to the corners,
     the title card sits low so the chosen character stays visible above it. */
  :root {
    --sky: #bfe3ee;        /* canvas clear colour */
    --ink: #2e2a27;        /* roof-tile charcoal, used for text and outlines */
    --wood: #6b4423;       /* hanok posts and signboards */
    --tongue: #e8798c;     /* the plush's pink tongue */
    --banana: #ffd23f;
    --card: rgba(247, 241, 227, 0.95);   /* hanji paper */
    --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--sky);
    color: var(--ink);
    font-family: var(--font-display);
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    word-break: keep-all;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    pointer-events: none;
  }
  .outlined { color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
  .score { font-size: clamp(44px, 11vw, 72px); line-height: 1; font-variant-numeric: tabular-nums; }
  .best { font-size: 17px; margin-top: 4px; letter-spacing: 0.02em; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; position: relative; }
  .pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 4px 14px 4px 8px;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
  }
  .banana-icon {
    width: 22px; height: 22px; display: inline-block; flex: none;
    background: var(--banana);
    border: 2px solid var(--ink);
    border-radius: 0 60% 0 60%;
    transform: rotate(-20deg);
  }
  .plus {
    position: absolute; right: 8px; top: 40px;
    font-size: 24px; color: var(--banana);
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    opacity: 0;
  }
  .plus.go { animation: plus 0.8s ease-out; }
  @keyframes plus { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-28px); } }
  .sound {
    pointer-events: auto;
    font: inherit; font-size: 15px; color: var(--ink);
    background: var(--card); border: 3px solid var(--ink); border-radius: 999px;
    padding: 4px 12px; cursor: pointer;
  }

  .toast {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 104px);
    left: 50%;
    transform: translate(-50%, 0);
    width: max-content;
    max-width: calc(100% - 32px);
    box-sizing: border-box;
    text-align: center;
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 14px;
    padding: 8px 18px 10px;
    pointer-events: none;
    transition: opacity 0.35s, transform 0.35s;
  }
  .toast[data-show="0"] { opacity: 0; transform: translate(-50%, -12px); }
  .toast small { display: block; font-size: 13px; letter-spacing: 0.08em; color: var(--wood); }
  .toast b { display: block; font-weight: 400; font-size: 28px; line-height: 1.15; }
  .toast span { display: block; font-size: 15px; margin-top: 2px; }

  .overlay {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    padding: 16px;
    pointer-events: none;
  }
  .overlay.low { align-items: end; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); }
  .card {
    pointer-events: auto;
    width: min(380px, 100%);
    box-sizing: border-box;
    text-align: center;
    background: var(--card);
    border: 4px solid var(--ink);
    border-radius: 22px;
    padding: 16px 18px;
    box-shadow: 0 7px 0 var(--ink);
  }
  .card h1 { margin: 0; font-weight: 400; font-size: clamp(34px, 10vw, 46px); line-height: 1.05; text-wrap: balance; }
  .card h1 span { color: var(--tongue); }
  .card .sub { margin: 4px 0 0; font-size: 15px; color: var(--wood); }
  .card h2 { margin: 0 0 2px; font-weight: 400; font-size: 32px; }
  .card .keys { font-size: 13px; line-height: 1.5; opacity: 0.75; margin-top: 10px; }

  .picker {
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px;
    margin-top: 12px;
    padding: 10px 0;
    border-block: 2px dashed rgba(46, 42, 39, 0.25);
  }
  .picker .info { min-width: 0; }
  .picker .name { font-size: 28px; line-height: 1.1; }
  .picker .desc { font-size: 14px; line-height: 1.35; margin-top: 2px; text-wrap: balance; }
  .arrow {
    width: 44px; height: 44px; border-radius: 50%;
    font: inherit; font-size: 26px; line-height: 1; color: var(--ink);
    background: #fff; border: 3px solid var(--ink); cursor: pointer;
  }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(46, 42, 39, 0.25); }
  .dots i.on { background: var(--ink); }

  .result { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; font-size: 15px; }
  .result b { display: block; font-weight: 400; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .result .total b { color: var(--tongue); }
  .reason { color: var(--tongue); font-size: 19px; }
  .best-line { margin-top: 6px; font-size: 17px; }
  .new-best { color: var(--tongue); font-size: 18px; margin-top: 2px; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; }
  .btn {
    font: inherit; font-size: 22px;
    color: var(--ink);
    background: var(--banana);
    border: 4px solid var(--ink);
    border-radius: 16px;
    padding: 7px 24px;
    box-shadow: 0 5px 0 var(--ink);
    cursor: pointer;
  }
  .btn.plain { background: #fff; font-size: 18px; }
  .btn:active, .arrow:active { transform: translateY(3px); }
  .btn:active { box-shadow: 0 2px 0 var(--ink); }
  .play { margin-top: 12px; }
  .btn:focus-visible, .sound:focus-visible, .arrow:focus-visible { outline: 3px solid var(--tongue); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } .plus.go { animation-duration: 0.01s; } }
</style>
</head>
<body>
<div id="stage" aria-label="게임 화면"></div>

<div class="hud">
  <div>
    <div class="score outlined" id="score">0</div>
    <div class="best outlined" id="best">최고 0</div>
  </div>
  <div class="right">
    <div class="pill" aria-label="모은 바나나"><i class="banana-icon"></i><span id="bananas">0</span></div>
    <div class="plus" id="plus">+5</div>
    <button class="sound" id="sound" type="button">소리 켬</button>
  </div>
</div>

<div class="toast" id="toast" data-show="0" aria-live="polite"><small>경주 명소</small><b id="toastName"></b><span id="toastDesc"></span></div>

<div class="overlay low" id="start">
  <div class="card">
    <h1>크로스 <span>게롱</span></h1>
    <p class="sub">황리단길에서 대릉원, 첨성대까지</p>
    <div class="picker">
      <button class="arrow" id="prev" type="button" aria-label="이전 캐릭터">‹</button>
      <div class="info">
        <div class="name" id="charName">게롱</div>
        <div class="desc" id="charDesc"></div>
        <div class="dots" id="dots"></div>
      </div>
      <button class="arrow" id="next" type="button" aria-label="다음 캐릭터">›</button>
    </div>
    <button class="btn play" id="play" type="button">출발하기</button>
    <div class="keys">바나나 1개 +5점 · 황금 바나나 +25점<br>방향키 · WASD · 스와이프 · 탭하면 앞으로</div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <h2>앗, <span id="overName">게롱</span>!</h2>
    <div class="reason" id="reason"></div>
    <div class="result">
      <div>거리<b id="dist">0</b></div>
      <div><span id="bananaCap">바나나</span><b id="bananaPts">0</b></div>
      <div class="total">점수<b id="final">0</b></div>
    </div>
    <div class="best-line">최고 기록 <span id="finalBest">0</span></div>
    <div class="new-best" id="newBest" hidden>새 최고 기록!</div>
    <div class="actions">
      <button class="btn" id="retry" type="button">다시 하기</button>
      <button class="btn plain" id="change" type="button">캐릭터 바꾸기</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  // ---------- constants ----------
  const PLAY = 5;          // playable columns: -PLAY..PLAY
  const SIDE = 14;         // visible columns each side
  const WRAP = SIDE + 4;   // movers wrap at ±WRAP
  const AHEAD = 22;        // rows generated in front of the player
  const BEHIND = 8;        // rows kept behind the player
  const HOP_TIME = 0.13;
  const BANANA_PTS = 5, GOLD_PTS = 25;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const $ = id => document.getElementById(id);

  // ---------- three setup ----------
  const stage = $('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0xbfe3ee);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
  const CAM_OFFSET = new THREE.Vector3(3.2, 10, 6.5);
  const FACE_CAMERA = Math.atan2(-CAM_OFFSET.x, -CAM_OFFSET.z);

  scene.add(new THREE.HemisphereLight(0xfffaf0, 0x8a8f7a, 0.64));
  const sun = new THREE.DirectionalLight(0xfff4e0, 0.72);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 45 });
  sun.shadow.bias = -0.0015;
  scene.add(sun, sun.target);

  function resize() {
    const w = window.innerWidth, h = window.innerHeight, aspect = w / h;
    let halfW, halfH;
    if (aspect < 1) { halfW = 5.6; halfH = halfW / aspect; }
    else { halfH = 5.2; halfW = halfH * aspect; }
    Object.assign(camera, { left: -halfW, right: halfW, top: halfH, bottom: -halfH });
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- geometry, materials, baking ----------
  const UNIT = new THREE.BoxGeometry(1, 1, 1);
  const PLANE = new THREE.PlaneGeometry(1, 1);
  const DOME = new THREE.SphereGeometry(1, 28, 12, 0, Math.PI * 2, 0, Math.PI / 2);
  const cylCache = new Map();
  function cylGeo(rt, rb, seg = 14) {
    const k = rt.toFixed(3) + ':' + rb.toFixed(3) + ':' + seg;
    if (!cylCache.has(k)) cylCache.set(k, new THREE.CylinderGeometry(rt, rb, 1, seg));
    return cylCache.get(k);
  }
  const matCache = new Map();
  function mat(color) {
    if (!matCache.has(color)) matCache.set(color, new THREE.MeshLambertMaterial({ color }));
    return matCache.get(color);
  }
  function box(w, h, d, color, x = 0, y = 0, z = 0, opts = {}) {
    const m = new THREE.Mesh(UNIT, opts.material || mat(color));
    m.scale.set(w, h, d);
    m.position.set(x, y, z);
    m.castShadow = opts.cast !== false;
    m.receiveShadow = true;
    return m;
  }
  function cyl(rt, rb, h, color, x = 0, y = 0, z = 0, seg = 14) {
    const m = new THREE.Mesh(cylGeo(rt, rb, seg), mat(color));
    m.scale.y = h;
    m.position.set(x, y, z);
    m.castShadow = m.receiveShadow = true;
    return m;
  }

  // Static scenery is merged into one vertex-coloured mesh per row, so a whole
  // street of hanok costs a single draw call. Meshes flagged `keep` (painted
  // signs) are carried over as they are.
  const BAKE_MAT = new THREE.MeshLambertMaterial({ vertexColors: true });
  const flatCache = new Map();
  function bake(root) {
    root.updateMatrixWorld(true);
    const out = new THREE.Group();
    const parts = [], kept = [];
    let count = 0;
    root.traverse(o => {
      if (!o.isMesh) return;
      if (o.userData.keep) { kept.push(o); return; }
      let geo = flatCache.get(o.geometry);
      if (!geo) { geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry; flatCache.set(o.geometry, geo); }
      parts.push([geo, o.matrixWorld, o.material.color]);
      count += geo.attributes.position.count;
    });
    if (count) {
      const pos = new Float32Array(count * 3), nor = new Float32Array(count * 3), col = new Float32Array(count * 3);
      const v = new THREE.Vector3(), nm = new THREE.Matrix3();
      let o = 0;
      for (const [geo, m, c] of parts) {
        nm.getNormalMatrix(m);
        const p = geo.attributes.position.array, n = geo.attributes.normal.array;
        for (let i = 0; i < p.length; i += 3, o += 3) {
          v.set(p[i], p[i + 1], p[i + 2]).applyMatrix4(m);
          pos[o] = v.x; pos[o + 1] = v.y; pos[o + 2] = v.z;
          v.set(n[i], n[i + 1], n[i + 2]).applyMatrix3(nm).normalize();
          nor[o] = v.x; nor[o + 1] = v.y; nor[o + 2] = v.z;
          col[o] = c.r; col[o + 1] = c.g; col[o + 2] = c.b;
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      g.computeBoundingSphere();
      const mesh = new THREE.Mesh(g, BAKE_MAT);
      mesh.castShadow = mesh.receiveShadow = true;
      mesh.userData.own = true;
      out.add(mesh);
    }
    for (const k of kept) {
      k.matrixWorld.decompose(k.position, k.quaternion, k.scale);
      k.parent.remove(k);
      out.add(k);
    }
    return out;
  }
  function disposeGroup(g) {
    g.traverse(o => { if (o.userData.own) o.geometry.dispose(); });
  }

  // ---------- painted signs ----------
  const labelCache = new Map();
  function labelTexture(text, bg, fg) {
    const key = text + bg + fg;
    if (labelCache.has(key)) return labelCache.get(key);
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    const font = '60px Jua, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    ctx.font = font;
    const w = Math.ceil(ctx.measureText(text).width) + 48, h = 96;
    c.width = w; c.height = h;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = fg; ctx.globalAlpha = 0.35; ctx.lineWidth = 6; ctx.strokeRect(6, 6, w - 12, h - 12); ctx.globalAlpha = 1;
    ctx.font = font; ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, w / 2, h / 2 + 4);
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    const entry = { mat: new THREE.MeshBasicMaterial({ map: tex }), aspect: w / h };
    labelCache.set(key, entry);
    return entry;
  }
  function label(text, x, y, z, height, maxW, style = 'wood') {
    const [bg, fg] = style === 'wood' ? ['#5b3a22', '#f7ecd6'] : style === 'stone' ? ['#6f6b64', '#fff8e8'] : ['#f7f1e3', '#2e2a27'];
    const { mat: m, aspect } = labelTexture(text, bg, fg);
    let w = height * aspect, h = height;
    if (w > maxW) { h *= maxW / w; w = maxW; }
    const mesh = new THREE.Mesh(PLANE, m);
    mesh.scale.set(w, h, 1);
    mesh.position.set(x, y, z);
    mesh.rotation.x = -0.3;
    mesh.userData.keep = true;
    return mesh;
  }

  // ---------- palette ----------
  const C = {
    pave: 0xe3d7bf, paveB: 0xd9ccb1, paveC: 0xcfc1a5, walk: 0xc4b497,
    lawn: 0x93c85e, lawnB: 0x8bc057, lawnOut: 0x7fb24d,
    road: 0x50535c, roadOut: 0x474a52, line: 0xf2f2e6,
    water: 0x5cc2e6, waterOut: 0x4fb2d6, lotus: 0x5f9e45, lotusFlower: 0xf6a5c0,
    rail: 0x8d7b6e, railOut: 0x7b6a5e, steel: 0xb8bcc4, sleeper: 0x5e4535,
    trunk: 0x6e4a2e, pine: 0x3e7b3b, pineB: 0x4b8c43, ginkgo: 0xf2c230, ginkgoB: 0xf7d354, maple: 0xd9472b, mapleB: 0xe8673e,
    leaf: 0x7da843, persimmon: 0xf28c28,
    stone: 0xa39a8a, stoneB: 0xb3ab9c, stoneDark: 0x8d877c,
    tile: 0x5a6170, tileDark: 0x3c424e, plaster: 0xf3ecdc, post: 0x6b4423, lattice: 0xc79a5f, glass: 0x8fb3c4,
    mound: 0x6fa83f, moundB: 0x5f9636,
    log: 0x8a5a33, logEnd: 0xc8925a,
    banana: 0xffd23f, bananaTip: 0x6b4b2a,
  };
  const CAR_COLORS = [0xff6b6b, 0x4dabf7, 0xffa94d, 0x9775fa, 0x51cf66, 0xf783ac, 0xfcc419];
  const SHOP_NAMES = ['카페', '찻집', '십원빵', '한복대여', '소품샵', '빙수', '사진관', '한옥스테이', '경주빵', '디저트', '기념품', '책방', '브런치', '젤라또'];

  // ---------- characters ----------
  function charRoot() {
    const root = new THREE.Group(), body = new THREE.Group();
    root.add(body);
    root.userData.body = body;
    return { root, body };
  }

  // 게롱: the grey gorilla plush from the first photo
  function buildGerong() {
    const { root, body } = charRoot();
    const fur = 0x4a4c55, light = 0xd6dad3, nose = 0x9ba29b;
    body.add(box(0.26, 0.2, 0.32, light, -0.17, 0.1, -0.1));
    body.add(box(0.26, 0.2, 0.32, light, 0.17, 0.1, -0.1));
    body.add(box(0.64, 0.46, 0.5, fur, 0, 0.38, 0.06));
    body.add(box(0.36, 0.26, 0.04, light, 0, 0.36, -0.2));
    body.add(box(0.17, 0.34, 0.2, fur, -0.36, 0.42, -0.06));
    body.add(box(0.17, 0.34, 0.2, fur, 0.36, 0.42, -0.06));
    body.add(box(0.22, 0.18, 0.24, light, -0.3, 0.26, -0.16));
    body.add(box(0.22, 0.18, 0.24, light, 0.3, 0.26, -0.16));
    const head = new THREE.Group();
    head.position.set(0, 0.6, -0.02);
    head.rotation.set(0.38, 0, -0.08);   // looking up, like the plush
    body.add(head);
    head.add(box(0.66, 0.5, 0.56, fur, 0, 0.25, 0.02));
    head.add(box(0.2, 0.08, 0.22, light, 0.04, 0.53, 0.06));
    head.add(box(0.46, 0.2, 0.06, light, 0, 0.36, -0.27));
    head.add(box(0.07, 0.09, 0.03, 0x141414, -0.1, 0.37, -0.31));
    head.add(box(0.07, 0.09, 0.03, 0x141414, 0.1, 0.37, -0.31));
    head.add(box(0.56, 0.26, 0.26, light, 0, 0.14, -0.36));
    head.add(box(0.08, 0.05, 0.02, nose, -0.09, 0.22, -0.495));
    head.add(box(0.08, 0.05, 0.02, nose, 0.09, 0.22, -0.495));
    head.add(box(0.32, 0.025, 0.02, nose, 0.02, 0.07, -0.495));
    head.add(box(0.03, 0.05, 0.02, nose, 0.19, 0.09, -0.495));
    head.add(box(0.09, 0.07, 0.03, 0xf2879a, -0.2, 0.1, -0.5));
    head.add(box(0.07, 0.15, 0.13, light, -0.355, 0.26, 0.02));
    head.add(box(0.07, 0.15, 0.13, light, 0.355, 0.26, 0.02));
    root.scale.setScalar(1.12);
    return root;
  }

  // 오롱: the orange monkey plush lying on its tummy, from the second photo
  function buildOrong() {
    const { root, body } = charRoot();

    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d');
    x.fillStyle = '#d99a4a'; x.fillRect(0, 0, 128, 128);
    x.strokeStyle = '#8c5a22'; x.lineWidth = 6;
    x.beginPath(); x.arc(64, 64, 54, 0, Math.PI * 2); x.stroke();
    x.fillStyle = '#8c5a22';
    x.font = '34px Jua, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';

    [[30, 4, 98], [22, 6, 90], [26, 4, 82], [16, 6, 75], [20, 4, 68], [10, 8, 60], [4, 8, 52]].forEach(([w, h, y]) => x.fillRect(64 - w, y, w * 2, h));

    return coinBackMat;

  function pine(S, x, z = 0, s = 1) {

  function roundTree(S, x, z, a, b, s = 1) {

  function stoneWall(S, x, w, z = 0, h = 0.55) {
    S.add(box(w, h, 0.42, C.stone, x, h / 2, z));
    for (let i = 0; i < w * 3; i++) S.add(box(0.2, 0.12, 0.03, pick([C.stoneB, C.stoneDark]), x - w / 2 + 0.15 + i * 0.32, rand(0.12, h - 0.1), z + 0.215, { cast: false }));

  function hanok(S, x, w, opts = {}) {
    const g = new THREE.Group();
    g.position.x = x;
    const d = 0.8, wallH = 0.62, glassy = opts.glass;
    g.add(box(w - 0.06, 0.16, d + 0.04, 0x9a958c, 0, 0.08, 0));
    g.add(box(w - 0.24, wallH, d - 0.1, glassy ? 0xe9e1cf : C.plaster, 0, 0.16 + wallH / 2, 0));
    const posts = Math.max(2, Math.round(w / 0.8) + 1);
    for (let i = 0; i < posts; i++) {
      const px = -w / 2 + 0.12 + i * (w - 0.24) / (posts - 1);
      g.add(box(0.08, wallH, 0.08, C.post, px, 0.16 + wallH / 2, d / 2 - 0.04));
    }
    g.add(box(w - 0.2, 0.07, 0.06, C.post, 0, 0.16 + wallH - 0.04, d / 2 - 0.03));
    // doors and lattice windows between the posts
    for (let i = 0; i < posts - 1; i++) {
      const px = -w / 2 + 0.12 + (i + 0.5) * (w - 0.24) / (posts - 1);
      const ww = (w - 0.24) / (posts - 1) - 0.18;
      if (glassy) g.add(box(ww, 0.42, 0.03, C.glass, px, 0.4, d / 2 - 0.04, { cast: false }));
      else {
        g.add(box(ww, 0.38, 0.03, C.lattice, px, 0.4, d / 2 - 0.04, { cast: false }));
        g.add(box(ww, 0.025, 0.035, 0x8a6236, px, 0.4, d / 2 - 0.035, { cast: false }));
        g.add(box(0.025, 0.38, 0.035, 0x8a6236, px, 0.4, d / 2 - 0.035, { cast: false }));
      }
    }
    // tiled roof with upturned corners
    const ry = 0.16 + wallH;
    g.add(box(w + 0.16, 0.1, d + 0.36, C.tile, 0, ry + 0.05, 0));
    g.add(box(w - 0.1, 0.16, d + 0.06, C.tile, 0, ry + 0.18, 0));
    g.add(box(w - 0.4, 0.12, d - 0.3, C.tile, 0, ry + 0.32, 0));
    g.add(box(w - 0.3, 0.08, 0.12, C.tileDark, 0, ry + 0.41, 0));
    [-1, 1].forEach(sx => [-1, 1].forEach(sz => g.add(box(0.18, 0.1, 0.18, C.tileDark, sx * (w / 2 + 0.03), ry + 0.12, sz * (d / 2 + 0.13)))));
    g.add(box(w + 0.18, 0.04, 0.05, 0xf2ead8, 0, ry - 0.01, d / 2 + 0.17, { cast: false }));
    if (opts.sign) g.add(label(opts.sign, 0, ry - 0.12, d / 2 + 0.03, 0.3, Math.min(1.6, w - 0.2), Math.random() < 0.7 ? 'wood' : 'paper'));
    if (opts.parasol) {
      const sx = rand(-w / 2 + 0.3, w / 2 - 0.3);
      g.add(box(0.04, 0.5, 0.04, 0xdddddd, sx, 0.25, d / 2 + 0.3));
      g.add(box(0.56, 0.06, 0.56, pick([0xf7f1e3, 0xe8798c, 0x7da843]), sx, 0.52, d / 2 + 0.3));
    }
    S.add(g);
  }
  function yard(S, x, w) {
    stoneWall(S, x, w, -0.25);
    const r = Math.random();
    const tx = x + rand(-w / 2 + 0.4, w / 2 - 0.4);
    if (r < 0.35) persimmon(S, tx, 0.1);
    else if (r < 0.6) ginkgo(S, tx, 0.1);
    else if (r < 0.75) maple(S, tx, 0.1);
    else stoneLantern(S, tx, 0.15);
  }
  // fill columns from..to (inclusive) with a run of shops and yards
  function fillShops(S, from, to, dense) {
    let c = from;
    while (c <= to) {
      const w = Math.min(randi(1, 3), to - c + 1);
      const x = c + (w - 1) / 2;
      const r = Math.random();
      if (w >= 2 && (dense || r < 0.55)) hanok(S, x, w, { sign: Math.random() < 0.75 ? pick(SHOP_NAMES) : null, glass: Math.random() < 0.3, parasol: Math.random() < 0.25 });
      else if (r < 0.8) yard(S, x, w);
      else if (w === 1) pick([ginkgo, maple, pine])(S, x);
      else { pine(S, x - 0.5); ginkgo(S, x + 0.5); }
      c += w;
    }
  }

  // ---------- Gyeongju landmarks ----------
  // Each builds the scenery for a zone of `len` park rows, mirrored by side s (±1).
  // Zone-local coordinates: x = column, z = -dr (dr = rows from the zone's first row).
  function ellipseBlock(set, len, cx, cdr, rx, rz) {
    for (let dr = 0; dr < len; dr++) for (let c = -PLAY; c <= PLAY; c++) {
      const a = (c - cx) / (rx * 0.85), b = (dr - cdr) / (rz * 0.85);
      if (a * a + b * b < 1) set.add(dr + ':' + c);
    }
  }

    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime, o = audio.createOscillator(), gn = audio.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      gn.gain.setValueAtTime(vol, t);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn).connect(audio.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }

    player.mesh.visible = true;
    particles.splice(0).forEach(p => scene.remove(p.mesh));
    distance = 0; bananaCount = 0; bananaPts = 0;
    scrollZ = 0;
    updateHud();
  }

  function startGame() {
    if (state !== 'title') reset();
    state = 'play';
    player.mesh.rotation.y = 0;
    player.mesh.position.y = 0;
    player.mesh.userData.body.scale.set(1, 1, 1);
    $('start').hidden = true;
    $('over').hidden = true;
    sfx.bell();
    toast('황리단길', '한옥 카페와 가게가 모인 경주의 골목');
  }
  function toTitle() {
    reset();
    state = 'title';
    $('over').hidden = true;
    $('start').hidden = false;
    $('play').focus({ preventScroll: true });
  }

  const rowAt = r => rows.get(r);

  function tryMove(dx, dr) {
    if (state !== 'play' || !player.alive) return;
    if (player.hop) { player.queue = [dx, dr]; return; }
    player.mesh.rotation.y = dr > 0 ? 0 : dr < 0 ? Math.PI : dx < 0 ? Math.PI / 2 : -Math.PI / 2;

    const toRow = player.row + dr;
    if (toRow < 0) return;
    const target = rowAt(toRow);
    if (!target) return;

    const toX = player.log && dr === 0 ? player.x + dx : Math.round(player.x) + dx;
    if (toX < -PLAY || toX > PLAY) return;
    if (LAND.has(target.type) && target.blocked.has(Math.round(toX))) { bump(); return; }

    player.hop = { t: 0, fromX: player.x, fromRow: player.row, toX, toRow, onLog: player.log && dr === 0 ? player.log : null };
    if (player.hop.onLog) player.hop.offsetFrom = player.logOffset;
    player.log = null;
    sfx.hop();
  }

  function bump() { player.mesh.userData.body.scale.set(1.1, 0.85, 1.1); }

  function collect(gold, x, z) {
    const pts = gold ? GOLD_PTS : BANANA_PTS;
    bananaCount++;
    bananaPts += pts;
    burst(x, 0.5, z, gold ? 0xffb300 : C.banana, gold ? 14 : 8);
    plus(pts);
    sfx.banana(gold);
    updateHud();
  }

  function land() {
    const h = player.hop;
    player.hop = null;
    player.row = h.toRow;
    const row = rowAt(player.row);
    player.x = h.onLog ? h.onLog.x + h.offsetFrom + (h.toX - h.fromX) : h.toX;
    if (player.row > distance) { distance = player.row; updateHud(); }

    if (row.type === 'river') {
      const log = row.movers.find(m => Math.abs(player.x - m.x) <= m.len / 2 + 0.25);
      if (!log) return die('splash', '풍덩! 연못에 빠졌어요');
      const first = -(log.len - 1) / 2;
      const i = Math.max(0, Math.min(log.len - 1, Math.round(player.x - log.x - first)));
      player.log = log;
      player.logOffset = first + i;
      player.x = log.x + player.logOffset;
      if (log.banana && Math.abs(log.banana.offset - player.logOffset) < 0.1) {
        log.mesh.remove(log.banana.mesh);
        collect(log.banana.gold, player.x, -row.r);
        log.banana = null;
      }
    } else {
      player.x = Math.round(player.x);
    }

    if (row.banana && row.banana.col === player.x && LAND.has(row.type)) {
      row.group.remove(row.banana.mesh);
      collect(row.banana.gold, player.x, -row.r);
      row.banana = null;
    }
    if (row.zone && !row.zone.announced) {
      row.zone.announced = true;
      toast(row.zone.lm.name, row.zone.lm.desc);
      sfx.bell();
    }

    while (maxGenerated < player.row + AHEAD) makeRow(++maxGenerated);
    rows.forEach((rw, k) => { if (k < player.row - BEHIND - 4) { world.remove(rw.group); disposeGroup(rw.group); rows.delete(k); } });

    if (player.queue) { const q = player.queue; player.queue = null; tryMove(q[0], q[1]); }
  }

  function die(kind, reason) {
    if (!player.alive) return;
    player.alive = false;
    player.dead = kind;
    player.log = null;
    player.hop = null;
    state = 'dying';
    deathTime = 0;
    const body = player.mesh.userData.body;
    if (kind === 'squish') { body.scale.set(1.35, 0.18, 1.35); sfx.squish(); burst(player.x, 0.3, -player.row, 0xdddddd, 10); }
    else if (kind === 'splash') { sfx.splash(); burst(player.x, 0.1, -player.row, 0xffffff, 16); }
    else if (kind === 'train') { sfx.squish(); burst(player.x, 0.5, -player.row, 0x888888, 14); }
    else sfx.splash();
    const s = score();
    if (s > best) { best = s; store.set('gerong.best', best); $('newBest').hidden = false; }
    else $('newBest').hidden = true;
    $('overName').textContent = CHARACTERS[charIndex].name;
    $('reason').textContent = reason;
    $('dist').textContent = distance;
    $('bananaCap').textContent = `바나나 ${bananaCount}개`;
    $('bananaPts').textContent = '+' + bananaPts;
    $('final').textContent = s;
    $('finalBest').textContent = best;
    updateHud();
  }

  function burst(x, y, z, color, n) {
    for (let i = 0; i < n; i++) {
      const m = box(0.12, 0.12, 0.12, color, x, y, z, { cast: false });
      scene.add(m);
      particles.push({ mesh: m, vx: rand(-2, 2), vy: rand(2, 5), vz: rand(-2, 2), life: rand(0.5, 0.9) });
    }
  }

  // ---------- update loop ----------
  function updateRows(dt) {
    const blink = Math.floor(elapsed * 8) % 2 === 0;
    rows.forEach(row => {
      for (const m of row.movers) {
        m.x += row.dir * row.speed * dt;
        if (row.dir > 0 && m.x - m.len / 2 > WRAP) m.x -= WRAP * 2 + m.len;
        if (row.dir < 0 && m.x + m.len / 2 < -WRAP) m.x += WRAP * 2 + m.len;
        m.mesh.position.x = m.x;
        if (m.banana) m.banana.mesh.rotation.y += dt * 2.4;
      }
      if (row.banana) {
        row.banana.mesh.rotation.y += dt * 2.4;
        row.banana.mesh.position.y = 0.45 + Math.sin(elapsed * 3 + row.r) * 0.06;
      }
      const tr = row.train;
      if (!tr) return;
      if (!tr.active) {
        tr.timer -= dt;
        const warn = tr.timer < 1.4;
        tr.lightMat.emissive.setHex(warn && blink ? 0xff2020 : 0x000000);
        if (warn && !tr.warned) { tr.warned = true; if (Math.abs(row.r - player.row) < 6 && state === 'play') sfx.horn(); }
        if (tr.timer <= 0) {
          tr.active = true;
          tr.warned = false;
          tr.x = row.dir > 0 ? -WRAP - 2 : WRAP + 2;
          tr.mesh.visible = true;
        }
      } else {
        tr.x += row.dir * 26 * dt;
        tr.lightMat.emissive.setHex(blink ? 0xff2020 : 0x000000);
        tr.mesh.position.x = tr.x;
        const tail = tr.x - row.dir * tr.len;
        if ((row.dir > 0 && tail > WRAP + 2) || (row.dir < 0 && tail < -WRAP - 2)) {
          tr.active = false;
          tr.mesh.visible = false;
          tr.timer = rand(3, 7);
          tr.lightMat.emissive.setHex(0x000000);
        }
      }
    });
  }

  const HIT_REASON = { car: '빵빵! 차에 치였어요', bus: '관광버스에 치였어요', carriage: '꽃마차에 부딪혔어요' };
  function updatePlayer(dt) {
    const body = player.mesh.userData.body;
    let px = player.x, py = 0, pz = -player.row;

    if (player.hop) {
      const h = player.hop;
      h.t += dt / HOP_TIME;
      const t = Math.min(h.t, 1);
      let fromX = h.fromX, toX = h.toX;
      if (h.onLog) { fromX = h.onLog.x + h.offsetFrom; toX = fromX + (h.toX - h.fromX); }
      px = fromX + (toX - fromX) * t;
      pz = -(h.fromRow + (h.toRow - h.fromRow) * t);
      py = Math.sin(Math.PI * t) * 0.45;
      body.scale.set(0.95, 1.08, 0.95);
      if (h.t >= 1) {
        body.scale.set(1.12, 0.86, 1.12);
        land();
        if (!player.alive) return;
        px = player.x; pz = -player.row; py = 0;
      }
    } else if (player.log) {
      player.x = player.log.x + player.logOffset;
      px = player.x;
      if (Math.abs(player.x) > PLAY + 0.7) return die('splash', '통나무에 실려 떠내려갔어요');
    }

    const k = Math.min(1, dt * 14);
    body.scale.x += (1 - body.scale.x) * k;
    body.scale.y += (1 - body.scale.y) * k;
    body.scale.z += (1 - body.scale.z) * k;
    player.mesh.position.set(px, py + (player.log && !player.hop ? 0.02 : 0), pz);

    const occRow = player.hop ? (player.hop.t > 0.5 ? player.hop.toRow : player.hop.fromRow) : player.row;
    const row = rowAt(occRow);
    if (!row) return;
    if (row.type === 'road') {
      for (const m of row.movers) {
        if (Math.abs(m.x - px) < m.len / 2 + 0.28) {
          player.mesh.position.y = 0;
          player.row = occRow; player.x = px;
          return die('squish', HIT_REASON[row.kind]);
        }
      }
    }
    if (row.type === 'rail' && row.train.active) {
      const tr = row.train;
      const front = tr.x + row.dir * tr.front, back = tr.x - row.dir * (tr.len - tr.front);
      if (px > Math.min(front, back) - 0.3 && px < Math.max(front, back) + 0.3) {
        player.row = occRow; player.x = px;
        return die('train', '칙칙폭폭! 기차를 피하지 못했어요');
      }
    }
    if (-pz < scrollZ - 3.2) return die('slow', '너무 느려요! 화면 밖으로 밀려났어요');
  }

  function updateDying(dt) {
    deathTime += dt;
    const body = player.mesh.userData.body;
    if (player.dead === 'splash') {
      player.mesh.position.y -= dt * 1.6;
      if (player.mesh.position.y < -1.2) player.mesh.visible = false;
    } else if (player.dead === 'train') {
      const row = rowAt(player.row);
      player.mesh.position.x += (row ? row.dir : 1) * 22 * dt;
      player.mesh.position.y += dt * 2;
      body.rotation.z += dt * 12;
    } else if (player.dead === 'slow') {
      body.rotation.x = Math.min(Math.PI / 2, body.rotation.x + dt * 6);
    }
    if (deathTime > 0.9 && state === 'dying') {
      state = 'over';
      $('over').hidden = false;
      $('retry').focus({ preventScroll: true });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.vy -= 14 * dt;
      p.mesh.position.x += p.vx * dt;
      p.mesh.position.y += p.vy * dt;
      p.mesh.position.z += p.vz * dt;
      if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
    }
  }

  const focus = new THREE.Vector3();
  function updateCamera(dt, snap) {
    const title = state === 'title';
    if (state === 'play') {
      // the view creeps forward on its own; standing still too long is fatal
      const speed = distance === 0 ? 0 : 0.38 + difficulty(distance) * 0.7;
      scrollZ += speed * dt;
      const pr = player.hop ? player.hop.toRow : player.row;
      if (pr > scrollZ) scrollZ += (pr - scrollZ) * Math.min(1, dt * 4);
    }
    // on the title screen, zoom in on the character and keep it above the card
    const zoom = title ? (window.innerWidth < window.innerHeight ? 1.9 : 1.5) : 1;
    const tx = title ? player.mesh.position.x + 0.2 : Math.max(-2, Math.min(2, player.mesh.position.x * 0.5));
    const tz = title ? 1.15 : -(scrollZ + 1.6);
    if (snap) { focus.set(tx, 0, tz); camera.zoom = zoom; }
    else {
      focus.x += (tx - focus.x) * Math.min(1, dt * 3);
      focus.z += (tz - focus.z) * Math.min(1, dt * 5);
      camera.zoom += (zoom - camera.zoom) * Math.min(1, dt * 4);
    }
    camera.updateProjectionMatrix();
    camera.position.copy(focus).add(CAM_OFFSET);
    camera.lookAt(focus);
    sun.position.set(focus.x - 6, 14, focus.z + 6);
    sun.target.position.copy(focus);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    elapsed += dt;
    updateRows(dt);
    if (state === 'play') updatePlayer(dt);
    else if (state === 'dying' || state === 'over') updateDying(dt);
    else if (state === 'title') {
      const body = player.mesh.userData.body;
      const b = Math.abs(Math.sin(elapsed * 3));
      player.mesh.rotation.y = FACE_CAMERA + Math.sin(elapsed * 1.3) * 0.3;
      player.mesh.position.y = b * 0.18;
      body.scale.set(1, 1 - (1 - b) * 0.06, 1);
    }
    if (toastTimer > 0 && (toastTimer -= dt) <= 0) $('toast').dataset.show = '0';
    updateParticles(dt);
    updateCamera(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  const KEYS = {
    ArrowUp: [0, 1], KeyW: [0, 1], Space: [0, 1],
    ArrowDown: [0, -1], KeyS: [0, -1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0],
    ArrowRight: [1, 0], KeyD: [1, 0],
  };
  window.addEventListener('keydown', e => {
    if (state === 'title') {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); setCharacter(charIndex - 1); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); setCharacter(charIndex + 1); }
      else if (e.code === 'Enter' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') { e.preventDefault(); startGame(); }
      return;
    }
    if (state === 'over') {
      if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); if (deathTime > 1.1) startGame(); }
      return;
    }
    const k = KEYS[e.code];
    if (!k) return;
    e.preventDefault();
    if (e.repeat) return;
    tryMove(k[0], k[1]);
  });

  let touch = null;
  stage.addEventListener('pointerdown', e => { touch = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
  stage.addEventListener('pointerup', e => {
    if (!touch || touch.id !== e.pointerId) return;
    const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
    touch = null;
    if (state !== 'play') return;
    if (Math.hypot(dx, dy) < 24) return tryMove(0, 1);
    if (Math.abs(dx) > Math.abs(dy)) tryMove(dx > 0 ? 1 : -1, 0);
    else tryMove(0, dy < 0 ? 1 : -1);
  });
  stage.addEventListener('pointercancel', () => { touch = null; });

  $('play').addEventListener('click', startGame);
  $('retry').addEventListener('click', startGame);
  $('change').addEventListener('click', toTitle);
  $('prev').addEventListener('click', () => setCharacter(charIndex - 1));
  $('next').addEventListener('click', () => setCharacter(charIndex + 1));

  // ---------- boot ----------
  function boot() {
    setCharacter(charIndex);
    reset();
    updateCamera(0, true);
    requestAnimationFrame(t => { last = t; frame(t); });
  }
  // wait briefly for the display font so the painted signs use it
  const fontReady = document.fonts && document.fonts.load ? document.fonts.load('60px Jua') : Promise.resolve();
  Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).catch(() => {}).then(boot);

  // test hook: jump straight to a row
  function warp(r) {
    while (maxGenerated < r + AHEAD) makeRow(++maxGenerated);
    Object.assign(player, { row: r, x: 0, log: null, hop: null });
    scrollZ = r;
    updateCamera(0, true);
  }
  window.__gerong = { get state() { return state; }, get score() { return score(); }, get rows() { return rows; }, player, tryMove, startGame, setCharacter, toTitle, warp };
})();
</script>
</body>
</html>
